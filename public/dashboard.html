<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard - Task list</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2f6;--panel:#fff;--ink:#14213d;--muted:#6b7890;--line:#d9e0ea;--accent:#2f5bea;--on:#fff;--mark:#ffe14d;--hi:#e5484d;--md:#f0a020;--lo:#3aa675}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--panel:#182030;--ink:#e8edf6;--muted:#8d9ab0;--line:#2a3548;--accent:#6f93ff;--on:#10151f;--mark:#8a7a1c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:920px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:2.4rem;line-height:1.1;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(transparent 62%,var(--mark) 62%)}
h2{font-size:1.05rem;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mini{background:none;border:1.5px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.82rem;cursor:pointer}
.ghost{background:none;border:1.5px solid var(--line);border-radius:10px;padding:10px 18px;cursor:pointer}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.nav{display:flex;gap:4px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:3px}
.nav a{border-radius:7px;padding:5px 14px;color:var(--muted);font-weight:600;text-decoration:none}
.nav a[aria-current=page]{background:var(--accent);color:var(--on)}
.actions{display:flex;gap:8px;align-items:center}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:2rem;line-height:1.1;font-weight:800}
.kpi span{color:var(--muted);font-size:.85rem}
.kpi.bad b{color:var(--hi)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-top:1px solid var(--line);vertical-align:middle}
th{border-top:0;color:var(--muted);font-weight:600;font-size:.8rem}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.late{color:var(--hi);font-weight:600}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;background:var(--lo)}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;font-size:.92rem}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
ul{list-style:none;margin:0;padding:0}
li.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
li.item:first-child{border-top:0}
.item .t{min-width:0;overflow-wrap:anywhere}.item small{display:block;color:var(--muted)}
.empty{color:var(--muted);margin:0}
.err{color:var(--hi);min-height:1.3em;margin:0 0 8px;font-size:.9rem}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--muted);font:11px "Bricolage Grotesque",system-ui,sans-serif}
dialog{border:1.5px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:20px;width:min(92vw,420px)}
dialog::backdrop{background:rgba(10,15,30,.5)}
dialog h2{margin:0 0 4px;font-size:1.3rem}
.acts{display:flex;justify-content:flex-end;margin-top:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Task <span>dashboard</span></h1>
  <p class="sub" id="sub">Loading...</p>
  <div class="top">
    <nav class="nav" aria-label="Pages"><a href="/">Admin</a><a href="/dashboard.html" aria-current="page">Dashboard</a></nav>
    <div class="actions"><button class="mini" id="refresh">Refresh</button><button class="mini" id="logout">Sign out</button></div>
  </div>
  <p class="err" id="err" role="alert"></p>

  <div id="board" hidden>
    <div class="kpis" id="kpis"></div>

    <section class="card" aria-labelledby="hDaily">
      <h2 id="hDaily">Tasks completed, last 14 days</h2>
      <div id="chart"></div>
    </section>

    <section class="card" aria-labelledby="hPeople">
      <h2 id="hPeople">By person</h2>
      <div class="scroll"><table>
        <thead><tr><th>Name</th><th class="n">Assigned</th><th class="n">Done</th><th class="n">Open</th><th class="n">Overdue</th><th>Progress</th></tr></thead>
        <tbody id="people"></tbody>
      </table></div>
    </section>

    <div class="grid">
      <section class="card" aria-labelledby="hPrio"><h2 id="hPrio">By priority</h2><div class="rows" id="prio"></div></section>
      <section class="card" aria-labelledby="hOver"><h2 id="hOver">Overdue tasks</h2><ul id="overdue"></ul></section>
    </div>

    <section class="card" aria-labelledby="hRecent"><h2 id="hRecent">Recently completed</h2><ul id="recent"></ul></section>
  </div>
</main>

<dialog id="viewDlg">
  <h2 id="vTitle">Photo evidence</h2>
  <img id="vImg" alt="Photo evidence for this task" style="width:100%;margin-top:8px;border-radius:10px">
  <div class="acts"><button type="button" class="ghost" id="vClose">Close</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props, ...kids) => { const n = Object.assign(document.createElement(tag), props); kids.forEach((k) => n.append(k)); return n; };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const PRIO = { high: ['High', 'var(--hi)'], med: ['Medium', 'var(--md)'], low: ['Low', 'var(--lo)'] };

async function api(path, method = 'GET') {
  const r = await fetch(path, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: method === 'GET' ? undefined : '{}' });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Something went wrong.'); e.status = r.status; throw e; }
  return d;
}
const fmtDay = (s) => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
const fmtTime = (iso) => new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const meter = (p) => { const m = el('div', { className: 'meter' }); m.setAttribute('role', 'img'); m.setAttribute('aria-label', p + '% done'); m.append(el('i')); m.firstChild.style.width = p + '%'; return m; };

function kpi(label, value, bad) { return el('div', { className: 'kpi' + (bad ? ' bad' : '') }, el('b', { textContent: value }), el('span', { textContent: label })); }

function drawChart(daily) {
  const W = 560, H = 150, base = 120, max = Math.max(1, ...daily.map((d) => d.n)), slot = W / daily.length, bw = slot * 0.62;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed per day over the last 14 days">`;
  s += `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)"/>`;
  daily.forEach((d, i) => {
    const h = Math.round((d.n / max) * (base - 22)), x = i * slot + (slot - bw) / 2;
    if (d.n) s += `<rect x="${x}" y="${base - h}" width="${bw}" height="${h}" rx="3" fill="var(--accent)"><title>${fmtDay(d.day)}: ${d.n}</title></rect><text x="${x + bw / 2}" y="${base - h - 5}" text-anchor="middle">${d.n}</text>`;
    if (i % 2 === 0 || i === daily.length - 1) s += `<text x="${x + bw / 2}" y="${base + 16}" text-anchor="middle">${d.day.slice(8)}</text>`;
  });
  $('chart').innerHTML = s + '</svg>';
}

function render(d) {
  const t = d.totals;
  $('kpis').replaceChildren(kpi('Total tasks', t.total), kpi('Done', t.done), kpi('Open', t.open), kpi('Overdue', t.overdue, t.overdue > 0), kpi('Completion', pct(t.done, t.total) + '%'));
  drawChart(d.daily);

  $('people').replaceChildren(...(d.people.length ? d.people.map((p) => {
    const open = p.assigned - p.done;
    return el('tr', {}, el('td', { textContent: p.name }), el('td', { className: 'n', textContent: p.assigned }), el('td', { className: 'n', textContent: p.done }),
      el('td', { className: 'n', textContent: open }), el('td', { className: 'n' + (p.overdue ? ' late' : ''), textContent: p.overdue }), el('td', {}, meter(pct(p.done, p.assigned))));
  }) : [el('tr', {}, el('td', { colSpan: 6, className: 'empty', textContent: 'No people yet.' }))]));

  const order = ['high', 'med', 'low'];
  $('prio').replaceChildren(...order.map((k) => {
    const r = d.priorities.find((x) => x.priority === k) || { total: 0, done: 0 };
    const dot = el('span', { className: 'dot' }); dot.style.background = PRIO[k][1];
    return el('div', { className: 'row' }, el('span', {}, dot, PRIO[k][0]), meter(pct(r.done, r.total)), el('span', { className: 'n', textContent: r.done + '/' + r.total }));
  }));

  $('overdue').replaceChildren(...(d.overdue.length ? d.overdue.map((o) => el('li', { className: 'item' },
    el('div', { className: 't' }, o.text, el('small', { textContent: (o.assignee_name || 'Unassigned') + ' - was due ' + fmtDay(o.due) }))))
    : [el('p', { className: 'empty', textContent: 'Nothing is overdue.' })]));

  $('recent').replaceChildren(...(d.recent.length ? d.recent.map((r) => el('li', { className: 'item' },
    el('div', { className: 't' }, r.text, el('small', { textContent: (r.assignee_name || 'Unassigned') + ' - ' + fmtTime(r.done_at) })),
    el('button', { className: 'mini', textContent: 'View photo', onclick: () => { $('vTitle').textContent = r.text; $('vImg').src = '/api/evidence?id=' + r.id + '&t=' + Date.now(); $('viewDlg').showModal(); } })))
    : [el('p', { className: 'empty', textContent: 'No completed tasks yet.' })]));

  $('sub').textContent = 'Updated ' + new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) + '. Refreshes every minute.';
  $('board').hidden = false;
}

async function refresh() {
  $('err').textContent = '';
  try { render(await api('/api/stats')); }
  catch (e) { if (e.status === 401 || e.status === 403) location.href = '/'; else $('err').textContent = e.message; }
}
$('refresh').onclick = refresh;
$('vClose').onclick = () => $('viewDlg').close();
$('logout').onclick = async () => { try { await api('/api/auth?action=logout', 'POST'); } catch (e) {} location.href = '/'; };

(async () => {
  try {
    const d = await api('/api/auth?action=me');
    if (!d.user || d.user.role !== 'admin') { location.href = '/'; return; }
  } catch (e) { location.href = '/'; return; }
  await refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
})();
</script>
</body>
</html>
