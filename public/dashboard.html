<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard - Task list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500;600&family=Instrument+Serif:ital@1&display=swap">
<style>
:root{
  --bg:#f3f4f8;--panel:#ffffff;--panel2:#f7f8fb;--ink:#0b1020;--ink2:#2a3247;--muted:#6a7389;--line:#e3e6ee;--line2:#eef0f5;
  --accent:#5b4ff5;--accent2:#14b8d4;--glow:rgba(91,79,245,.16);
  --hi:#e5394f;--hi-bg:rgba(229,57,79,.08);--md:#e8950c;--lo:#12a368;--lo-bg:rgba(18,163,104,.09);
  --avl:40%;--shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px -12px rgba(16,24,40,.12);
  --grid:rgba(11,16,32,.035);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;--serif:"Instrument Serif",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#06080e;--panel:#0d111b;--panel2:#111726;--ink:#eef1f8;--ink2:#c3c9d8;--muted:#8790a6;--line:#1c2334;--line2:#151b2a;
  --accent:#8b80ff;--accent2:#3fe0f5;--glow:rgba(139,128,255,.22);
  --hi:#ff5a6e;--hi-bg:rgba(255,90,110,.1);--md:#ffb547;--lo:#2fd18b;--lo-bg:rgba(47,209,139,.1);
  --avl:72%;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 12px 32px -16px rgba(0,0,0,.6);
  --grid:rgba(255,255,255,.028);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font:400 15px/1.5 var(--sans);background:
  radial-gradient(900px 420px at 15% -10%,var(--glow),transparent 70%),
  radial-gradient(700px 380px at 95% 0%,rgba(20,184,212,.10),transparent 70%),
  linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,
  linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px,
  var(--bg);background-attachment:fixed;-webkit-font-smoothing:antialiased}
main{max-width:1180px;margin:0 auto;padding:20px 16px 72px}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ic{display:inline-flex;flex:none}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:10px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--panel) 78%,transparent);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--shadow);margin-bottom:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.logo{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 4px 14px -4px var(--accent)}
.logo svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;gap:2px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px}
.nav a{border-radius:8px;padding:6px 16px;color:var(--muted);font-weight:500;font-size:.9rem;text-decoration:none;transition:color .15s,background .15s}
.nav a:hover{color:var(--ink)}
.nav a[aria-current=page]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 1px var(--line)}
.actions{display:flex;gap:6px;align-items:center}
.live{display:inline-flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted);padding:0 10px;font-family:var(--mono)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--lo);box-shadow:0 0 0 0 var(--lo);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--lo) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.85rem;font-weight:500;cursor:pointer;transition:border-color .15s,transform .1s,background .15s}
.btn:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn.spin .ic svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* hero */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin:0 4px 22px}
.eyebrow{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);margin:0 0 8px}
h1{font-size:clamp(2.1rem,4.6vw,3.3rem);line-height:1;margin:0;font-weight:600;letter-spacing:-.035em}
h1 em{font-family:var(--serif);font-weight:400;font-style:italic;letter-spacing:-.01em;background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em}
.sub{color:var(--muted);margin:10px 0 0;font-size:.92rem}
.today{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:right}
.today b{display:block;color:var(--ink);font-size:1rem;font-weight:600}
.err{color:var(--hi);margin:0 4px;font-size:.9rem}
.err:not(:empty){background:var(--hi-bg);border:1px solid color-mix(in srgb,var(--hi) 30%,transparent);border-radius:12px;padding:10px 14px;margin-bottom:16px}

/* cards */
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
h2{font-size:.98rem;font-weight:600;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h2 .ic{color:var(--muted)}
.tag{font-family:var(--mono);font-size:.72rem;color:var(--muted);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:2px 9px}

/* overview */
.overview{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:16px;margin-bottom:16px}
.ringcard{display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;margin:0}
.ringcard::after{content:"";position:absolute;inset:auto -40% -60% -40%;height:70%;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.ring{position:relative;width:176px;height:176px;margin:8px auto 14px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:12}
.ring .track{stroke:var(--line2)}
.ring .val{stroke:url(#ringGrad);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--mono);font-size:2.6rem;font-weight:600;line-height:1;letter-spacing:-.04em}
.ring-c b small{font-size:1.1rem;color:var(--muted);margin-left:2px}
.ring-c span{font-size:.78rem;color:var(--muted);margin-top:6px}
.ringfoot{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px;position:relative;z-index:1}
.ringfoot b{color:var(--ink);font-family:var(--mono);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.kpi{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow);overflow:hidden;transition:transform .2s,border-color .2s}
.kpi:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--c,var(--accent)) 40%,var(--line))}
.kpi-l{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:.84rem;font-weight:500}
.kpi-l .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 12%,transparent)}
.kpi b{display:block;font-family:var(--mono);font-size:2.2rem;line-height:1;font-weight:600;letter-spacing:-.04em;margin:14px 0 8px}
.kpi small{font-size:.8rem;color:var(--muted)}
.kpi .spark{position:absolute;left:0;bottom:0;height:3px;background:var(--c,var(--accent));opacity:.7;border-radius:0 3px 3px 0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.kpi.wide{grid-column:span 2}
.kpi.alert{background:linear-gradient(135deg,var(--hi-bg),transparent 70%),var(--panel);border-color:color-mix(in srgb,var(--hi) 35%,var(--line))}
.kpi.alert b{color:var(--hi)}
.kpi.calm{background:linear-gradient(135deg,var(--lo-bg),transparent 70%),var(--panel)}

/* chart */
.chartmeta{display:flex;gap:20px}
.chartmeta div{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chartmeta b{display:block;font-family:var(--mono);font-size:1.15rem;color:var(--ink);letter-spacing:-.02em;text-transform:none;font-weight:600}
#chart svg{width:100%;height:auto;display:block;overflow:visible}
#chart text{fill:var(--muted);font:500 11px var(--mono)}
#chart .vl{fill:var(--ink2);font-weight:600}
#chart .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transition:opacity .15s}
#chart .bar:hover{opacity:.75}
@keyframes grow{from{transform:scaleY(0)}}

/* table */
.scroll{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:560px}
th,td{text-align:left;padding:11px 8px;border-top:1px solid var(--line2);vertical-align:middle}
th{border-top:0;color:var(--muted);font-weight:500;font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;padding-top:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--panel2)}
td.n,th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px;font-weight:500}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:.72rem;font-weight:600;background:hsl(var(--h) 75% 55% / .15);color:hsl(var(--h) 65% var(--avl));box-shadow:inset 0 0 0 1px hsl(var(--h) 70% 55% / .25)}
.late{color:var(--hi);font-weight:600}
.pill-late{display:inline-block;background:var(--hi-bg);color:var(--hi);border-radius:99px;padding:1px 9px;font-weight:600}
.prog{display:flex;align-items:center;gap:10px;min-width:150px}
.prog .num{font-size:.8rem;color:var(--muted);width:38px;text-align:right}
.meter{flex:1;height:7px;background:var(--line2);border-radius:99px;overflow:hidden;min-width:70px}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid>.card{margin-bottom:16px}

/* priority */
.rows{display:grid;gap:18px}
.prow-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:.9rem}
.prow-h span:first-child{display:flex;align-items:center;gap:8px;font-weight:500}
.prow-h .num{color:var(--muted);font-size:.82rem}
.prow-h .num b{color:var(--ink);font-weight:600}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.prow .meter{height:10px}
.prow .meter i{background:var(--pc)}

/* lists */
ul{list-style:none;margin:0;padding:0}
li.item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line2)}
li.item:first-child{border-top:0;padding-top:2px}
.item .t{min-width:0;overflow-wrap:anywhere;flex:1;font-weight:500}
.item small{display:block;color:var(--muted);font-weight:400;font-size:.8rem;margin-top:2px}
.od{border-left:3px solid var(--hi);padding-left:12px;border-radius:2px}
.badge{flex:none;font-family:var(--mono);font-size:.74rem;font-weight:600;color:var(--hi);background:var(--hi-bg);border-radius:8px;padding:4px 8px;white-space:nowrap}
.empty{color:var(--muted);margin:0;display:flex;align-items:center;gap:10px;padding:18px;border:1px dashed var(--line);border-radius:12px;font-size:.9rem;justify-content:center}
.empty.good{color:var(--lo);border-color:color-mix(in srgb,var(--lo) 35%,var(--line));background:var(--lo-bg)}

/* timeline */
.tl li.item{position:relative;padding-left:34px}
.tl li.item::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--line2)}
.tl li.item:first-child::before{top:14px}
.tl li.item:last-child::before{bottom:calc(100% - 14px)}
.chk{position:absolute;left:0;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--lo-bg);color:var(--lo);box-shadow:0 0 0 4px var(--panel)}
.tl li.item:first-child .chk{top:calc(50% - 5px)}
.chk svg{width:13px;height:13px;stroke-width:3}
.photo{flex:none}

/* comments */
.cm{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line2)}
.cm:first-child{border-top:0;padding-top:2px}
.bubble{flex:1;min-width:0}
.bubble .meta{font-size:.8rem;color:var(--muted);margin-bottom:5px}
.bubble .meta b{color:var(--ink);font-weight:600}
.bubble p{margin:0;background:var(--panel2);border:1px solid var(--line2);border-radius:4px 14px 14px 14px;padding:9px 13px;overflow-wrap:anywhere}

/* skeleton */
.sk{background:linear-gradient(90deg,var(--line2) 0,var(--line) 50%,var(--line2) 100%) 0 0/200% 100%;animation:shim 1.4s infinite;border-radius:18px}
@keyframes shim{to{background-position:-200% 0}}
.skel{display:grid;gap:16px}
.skel .r1{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:16px}
.skel .r1>div{height:260px}

/* dialog */
dialog{border:1px solid var(--line);border-radius:20px;background:var(--panel);color:var(--ink);padding:20px;width:min(92vw,520px);box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
dialog[open]{animation:pop .22s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
dialog::backdrop{background:rgba(5,8,18,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
dialog h2{font-size:1.1rem;padding-right:8px}
.dlg-k{font-family:var(--mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:0 0 6px}
#vImg{width:100%;margin-top:14px;border-radius:12px;background:var(--panel2);min-height:120px;display:block}
.acts{display:flex;justify-content:flex-end;margin-top:16px}
[hidden]{display:none!important}

@media (max-width:900px){.overview,.skel .r1{grid-template-columns:1fr}.grid{grid-template-columns:1fr}}
@media (max-width:560px){
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi b{font-size:1.8rem}
  .top{top:6px;flex-wrap:nowrap;padding-left:8px}.live,.brand-t{display:none}.btn .lbl{display:none}.nav a{padding:6px 12px}
  .hero{align-items:flex-start}.today{text-align:left}
  .chartmeta{gap:14px}.card{padding:16px;border-radius:16px}.scroll{margin:0 -16px;padding:0 16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient>
</defs></svg>
<main>
  <div class="top">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="brand-t">Taskboard</span></div>
    <nav class="nav" aria-label="Pages"><a href="/dashboard" aria-current="page">Dashboard</a><a href="/tasks">Task</a></nav>
    <div class="actions">
      <span class="live" aria-live="off"><i></i><span id="countdown">Live</span></span>
      <button class="btn" id="refresh" title="Refresh now"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></span><span class="lbl">Refresh</span></button>
      <button class="btn" id="logout" title="Sign out"><span class="ic"><svg viewBox="0 0 24 24"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h12"/></svg></span><span class="lbl">Sign out</span></button>
    </div>
  </div>

  <header class="hero">
    <div>
      <p class="eyebrow">Admin overview</p>
      <h1>Task <em>dashboard</em></h1>
      <p class="sub" id="sub">Loading...</p>
    </div>
    <div class="today" id="today"></div>
  </header>

  <p class="err" id="err" role="alert"></p>

  <div class="skel" id="skel" aria-hidden="true">
    <div class="r1"><div class="sk"></div><div class="sk"></div></div>
    <div class="sk" style="height:260px"></div>
    <div class="sk" style="height:220px"></div>
  </div>

  <div id="board" hidden>
    <div class="overview" id="kpis"></div>

    <section class="card" aria-labelledby="hDaily">
      <div class="card-h">
        <h2 id="hDaily"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg></span>Tasks completed, last 14 days</h2>
        <div class="chartmeta" id="chartMeta"></div>
      </div>
      <div id="chart"></div>
    </section>

    <section class="card" aria-labelledby="hPeople">
      <div class="card-h"><h2 id="hPeople"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M16 4a4 4 0 0 1 0 8M22 21a7 7 0 0 0-4-6.3"/></svg></span>By person</h2><span class="tag" id="peopleTag"></span></div>
      <div class="scroll"><table>
        <thead><tr><th>Name</th><th class="n">Assigned</th><th class="n">Done</th><th class="n">Open</th><th class="n">Overdue</th><th>Progress</th></tr></thead>
        <tbody id="people"></tbody>
      </table></div>
    </section>

    <div class="grid">
      <section class="card" aria-labelledby="hPrio">
        <div class="card-h"><h2 id="hPrio"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 21V4M4 4h12l-2 4 2 4H4"/></svg></span>By priority</h2></div>
        <div class="rows" id="prio"></div>
      </section>
      <section class="card" aria-labelledby="hOver">
        <div class="card-h"><h2 id="hOver"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>Overdue tasks</h2><span class="tag" id="overTag"></span></div>
        <ul id="overdue"></ul>
      </section>
    </div>

    <div class="grid">
      <section class="card" aria-labelledby="hRecent">
        <div class="card-h"><h2 id="hRecent"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg></span>Recently completed</h2></div>
        <ul class="tl" id="recent"></ul>
      </section>
      <section class="card" aria-labelledby="hComm">
        <div class="card-h"><h2 id="hComm"><span class="ic"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>Latest comments</h2></div>
        <ul id="comments"></ul>
      </section>
    </div>
  </div>
</main>

<dialog id="viewDlg">
  <p class="dlg-k">Photo evidence</p>
  <h2 id="vTitle">Photo evidence</h2>
  <img id="vImg" alt="Photo evidence for this task">
  <div class="acts"><button type="button" class="btn" id="vClose">Close</button></div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props, ...kids) => { const n = Object.assign(document.createElement(tag), props); kids.forEach((k) => n.append(k)); return n; };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const PRIO = { high: ['High', 'var(--hi)'], med: ['Medium', 'var(--md)'], low: ['Low', 'var(--lo)'] };
const REFRESH_MS = 60000;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
let firstRender = true, lastRefresh = 0;

// Static icon markup only (never user data).
const ICON = {
  total: '<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
  done: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  prog: '<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9"/><path d="M12 7v5l3 3"/></svg>',
  open: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/></svg>',
  late: '<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2L12 3z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
  ok: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>',
  cam: '<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  inbox: '<svg viewBox="0 0 24 24"><path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 2h6l1-2h5"/></svg>'
};
const icon = (k, cls = 'ic') => el('span', { className: cls, innerHTML: ICON[k] });

async function api(path, method = 'GET') {
  const r = await fetch(path, { method, credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: method === 'GET' ? undefined : '{}' });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || 'Something went wrong.'); e.status = r.status; throw e; }
  return d;
}
const parseDay = (s) => { const p = s.split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); };
const fmtDay = (s) => parseDay(s).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtTime = (iso) => new Date(iso).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
const daysLate = (s) => { const t = new Date(); t.setHours(0, 0, 0, 0); return Math.max(1, Math.round((t - parseDay(s)) / 864e5)); };

function initials(name) { const p = String(name || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p.length > 1 ? p[p.length - 1][0] : '')).toUpperCase(); }
function hue(name) { let h = 0; for (const c of String(name || '')) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
function avatar(name) { const a = el('span', { className: 'av', textContent: initials(name) }); a.style.setProperty('--h', hue(name)); a.setAttribute('aria-hidden', 'true'); return a; }

function meter(p, color) {
  const m = el('div', { className: 'meter' }); m.setAttribute('role', 'img'); m.setAttribute('aria-label', p + '% done');
  const i = el('i'); if (color) i.style.setProperty('--pc', color); m.append(i);
  requestAnimationFrame(() => requestAnimationFrame(() => { i.style.width = p + '%'; }));
  return m;
}

function countUp(node, value, suffix = '') {
  if (!firstRender || reduced || !value) { node.textContent = value + suffix; return; }
  const start = performance.now(), dur = 900;
  const step = (now) => { const k = Math.min(1, (now - start) / dur), e = 1 - Math.pow(1 - k, 3); node.textContent = Math.round(value * e) + suffix; if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

function kpi(label, value, iconKey, color, note, extra = '') {
  const b = el('b'); countUp(b, value);
  const card = el('div', { className: 'kpi ' + extra }, el('div', { className: 'kpi-l' }, el('span', { textContent: label }), icon(iconKey)), b, el('small', { textContent: note }));
  card.style.setProperty('--c', color);
  return card;
}

function ringCard(t) {
  const p = pct(t.done, t.total), R = 76, C = 2 * Math.PI * R;
  const wrap = el('div', { className: 'ring' });
  wrap.innerHTML = `<svg viewBox="0 0 176 176" aria-hidden="true"><circle class="track" cx="88" cy="88" r="${R}"/><circle class="val" cx="88" cy="88" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>`;
  const val = wrap.querySelector('.val');
  requestAnimationFrame(() => requestAnimationFrame(() => { val.style.strokeDashoffset = C * (1 - p / 100); }));
  const b = el('b'); const s = el('small', { textContent: '%' });
  countUp(b, p); const center = el('div', { className: 'ring-c' }, el('div', {}, b, s), el('span', { textContent: 'completion rate' }));
  wrap.append(center); wrap.setAttribute('role', 'img'); wrap.setAttribute('aria-label', p + '% of tasks completed');
  const foot = el('div', { className: 'ringfoot' },
    el('span', {}, el('b', { textContent: t.done }), ' done'),
    el('span', {}, el('b', { textContent: Math.max(0, t.total - t.done) }), ' remaining'));
  return el('section', { className: 'card ringcard' }, el('div', { className: 'card-h' }, el('h2', { textContent: 'Overall progress' }), el('span', { className: 'tag', textContent: t.total + ' tasks' })), wrap, foot);
}

let lastDaily = null, narrow = innerWidth < 560;
addEventListener('resize', () => { const nw = innerWidth < 560; if (nw !== narrow) { narrow = nw; if (lastDaily) drawChart(lastDaily); } });
function drawChart(daily) {
  lastDaily = daily;
  const W = narrow ? 380 : 680, H = 210, pl = 30, top = 26, base = 176, n = daily.length || 1;
  const max = Math.max(1, ...daily.map((d) => d.n)), slot = (W - pl) / n, bw = Math.min(30, slot * 0.58);
  const y = (v) => base - (v / max) * (base - top);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tasks completed per day over the last 14 days"><defs>
    <linearGradient id="barG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent2)"/><stop offset="1" style="stop-color:var(--accent)"/></linearGradient>
    <linearGradient id="barL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:.35"/></linearGradient></defs>`;
  [max, Math.round(max / 2)].filter((v, i, a) => v > 0 && a.indexOf(v) === i).forEach((v) => {
    s += `<line x1="${pl}" y1="${y(v)}" x2="${W}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 5"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  });
  s += `<line x1="${pl}" y1="${base}" x2="${W}" y2="${base}" stroke="var(--line)"/><text x="${pl - 8}" y="${base + 4}" text-anchor="end">0</text>`;
  daily.forEach((d, i) => {
    const h = Math.max(0, base - y(d.n)), x = pl + i * slot + (slot - bw) / 2, last = i === daily.length - 1;
    if (d.n) s += `<rect class="bar" style="animation-delay:${i * 35}ms" x="${x}" y="${base - h}" width="${bw}" height="${h}" rx="6" fill="url(#${last ? 'barG' : 'barL'})"><title>${fmtDay(d.day)}: ${d.n} completed</title></rect><text class="vl" x="${x + bw / 2}" y="${base - h - 7}" text-anchor="middle">${d.n}</text>`;
    else s += `<rect x="${x}" y="${base - 3}" width="${bw}" height="3" rx="1.5" fill="var(--line)"><title>${fmtDay(d.day)}: 0 completed</title></rect>`;
    if (i % (narrow ? 3 : 2) === 0 || last) s += `<text x="${x + bw / 2}" y="${base + 20}" text-anchor="middle">${d.day.slice(8)}</text>`;
  });
  $('chart').innerHTML = s + '</svg>';

  const sum = daily.reduce((a, d) => a + d.n, 0), best = daily.reduce((a, d) => (d.n > a.n ? d : a), { n: 0 });
  const stat = (label, v) => el('div', {}, el('b', { textContent: v }), label);
  $('chartMeta').replaceChildren(stat('Completed', sum), stat('Daily avg', (sum / n).toFixed(1)), stat('Best day', best.n ? fmtDay(best.day) : '-'));
}

const empty = (text, good) => el('p', { className: 'empty' + (good ? ' good' : '') }, icon(good ? 'ok' : 'inbox'), text);

function render(d) {
  const t = d.totals, share = (v) => pct(v, t.total) + '% of all tasks';
  const overdueCard = kpi('Overdue', t.overdue, t.overdue > 0 ? 'late' : 'ok', t.overdue > 0 ? 'var(--hi)' : 'var(--lo)',
    t.overdue > 0 ? (t.overdue === 1 ? '1 task needs attention' : t.overdue + ' tasks need attention') : 'Everything is on schedule', 'wide ' + (t.overdue > 0 ? 'alert' : 'calm'));
  const cards = [
    kpi('Total tasks', t.total, 'total', 'var(--accent)', d.people.length + (d.people.length === 1 ? ' person' : ' people') + ' assigned'),
    kpi('Done', t.done, 'done', 'var(--lo)', share(t.done)),
    kpi('In progress', t.started, 'prog', 'var(--accent2)', share(t.started)),
    kpi('Open', t.open, 'open', 'var(--md)', share(t.open)),
    overdueCard
  ];
  cards.slice(0, 4).forEach((c, i) => { const sp = el('span', { className: 'spark' }); c.append(sp); const v = [t.total, t.done, t.started, t.open][i]; requestAnimationFrame(() => requestAnimationFrame(() => { sp.style.width = (i === 0 ? 100 : pct(v, t.total)) + '%'; })); });
  $('kpis').replaceChildren(ringCard(t), el('div', { className: 'kpis' }, ...cards));

  drawChart(d.daily);

  $('peopleTag').textContent = d.people.length + (d.people.length === 1 ? ' member' : ' members');
  $('people').replaceChildren(...(d.people.length ? d.people.map((p) => {
    const open = p.assigned - p.done, pp = pct(p.done, p.assigned);
    return el('tr', {},
      el('td', {}, el('div', { className: 'who' }, avatar(p.name), el('span', { textContent: p.name }))),
      el('td', { className: 'n', textContent: p.assigned }), el('td', { className: 'n', textContent: p.done }), el('td', { className: 'n', textContent: open }),
      el('td', { className: 'n' }, p.overdue ? el('span', { className: 'pill-late', textContent: p.overdue }) : el('span', { textContent: '0', style: 'color:var(--muted)' })),
      el('td', {}, el('div', { className: 'prog' }, meter(pp), el('span', { className: 'num', textContent: pp + '%' }))));
  }) : [el('tr', {}, el('td', { colSpan: 6 }, empty('No people yet.')))]));

  const order = ['high', 'med', 'low'];
  $('prio').replaceChildren(...order.map((k) => {
    const r = d.priorities.find((x) => x.priority === k) || { total: 0, done: 0 };
    const dot = el('span', { className: 'dot' }); dot.style.background = PRIO[k][1];
    return el('div', { className: 'prow' },
      el('div', { className: 'prow-h' }, el('span', {}, dot, PRIO[k][0]), el('span', { className: 'num' }, el('b', { textContent: r.done }), ' / ' + r.total + ' · ' + pct(r.done, r.total) + '%')),
      meter(pct(r.done, r.total), PRIO[k][1]));
  }));

  $('overTag').textContent = d.overdue.length ? d.overdue.length + ' late' : 'clear';
  $('overdue').replaceChildren(...(d.overdue.length ? d.overdue.map((o) => { const dl = daysLate(o.due); return el('li', { className: 'item' },
    el('div', { className: 't od' }, o.text, el('small', { textContent: (o.assignee_name || 'Unassigned') + ' · was due ' + fmtDay(o.due) })),
    el('span', { className: 'badge', textContent: dl + (dl === 1 ? ' day' : ' days') + ' late' })); })
    : [empty('Nothing is overdue.', true)]));

  $('recent').replaceChildren(...(d.recent.length ? d.recent.map((r) => el('li', { className: 'item' },
    icon('done', 'chk'),
    el('div', { className: 't' }, r.text, el('small', { textContent: (r.assignee_name || 'Unassigned') + ' · ' + fmtTime(r.done_at) })),
    el('button', { className: 'btn photo', title: 'View photo evidence', onclick: () => { $('vTitle').textContent = r.text; $('vImg').src = '/api/evidence?id=' + r.id + '&t=' + Date.now(); $('viewDlg').showModal(); } }, icon('cam'), el('span', { className: 'lbl', textContent: 'Photo' }))))
    : [empty('No completed tasks yet.')]));

  $('comments').replaceChildren(...(d.comments.length ? d.comments.map((c) => el('li', { className: 'cm' },
    avatar(c.author_name || 'Someone'),
    el('div', { className: 'bubble' },
      el('div', { className: 'meta' }, el('b', { textContent: c.author_name || 'Someone' }), ' on "' + c.task_text + '" · ' + fmtTime(c.created_at)),
      el('p', { textContent: c.body }))))
    : [empty('No comments yet.')]));

  $('sub').textContent = 'Updated ' + new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' }) + '. Refreshes every minute.';
  $('skel').hidden = true;
  $('board').hidden = false;
  firstRender = false;
}

async function refresh() {
  $('err').textContent = '';
  $('refresh').classList.add('spin');
  try { render(await api('/api/stats')); lastRefresh = Date.now(); }
  catch (e) { if (e.status === 401 || e.status === 403) location.href = '/'; else { $('err').textContent = e.message; $('skel').hidden = true; } }
  finally { $('refresh').classList.remove('spin'); }
}
$('refresh').onclick = refresh;
$('vClose').onclick = () => $('viewDlg').close();
$('viewDlg').addEventListener('click', (e) => { if (e.target === $('viewDlg')) $('viewDlg').close(); });
$('logout').onclick = async () => { try { await api('/api/auth?action=logout', 'POST'); } catch (e) {} location.href = '/'; };

const now = new Date();
$('today').replaceChildren(el('b', { textContent: now.toLocaleDateString(undefined, { weekday: 'long' }) }), now.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }));
setInterval(() => { if (lastRefresh) $('countdown').textContent = 'Live · ' + Math.max(0, Math.ceil((REFRESH_MS - (Date.now() - lastRefresh)) / 1000)) + 's'; }, 1000);

(async () => {
  try {
    const d = await api('/api/auth?action=me');
    if (!d.user || !['admin', 'viewer'].includes(d.user.role)) { location.href = '/'; return; }
  } catch (e) { location.href = '/'; return; }
  await refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, REFRESH_MS);
})();
</script>
